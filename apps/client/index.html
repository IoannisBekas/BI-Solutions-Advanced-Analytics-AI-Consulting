  <!-- Marks the document as script-capable before first paint. Scroll-reveal
       animations serialize opacity:0 into the prerendered HTML; clients clear
       this instantly, while JS-less crawlers keep the content visible. -->
  <script>document.documentElement.setAttribute("data-js", "");</script>
  <script>
    try {
      const savedConsent = JSON.parse(localStorage.getItem("bi-measurement-consent-v2") || "null");
      if (
        savedConsent &&
        typeof savedConsent.analytics === "boolean" &&
        typeof savedConsent.ads === "boolean" &&
        typeof savedConsent.savedAt === "number" &&
        Date.now() - savedConsent.savedAt <= 180 * 86400000
      ) {
        document.documentElement.setAttribute("data-cookie-consent", "saved");
      }
    } catch {}
  </script>
